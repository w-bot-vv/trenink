<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Trénink">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Trénink</title>
<style>
:root{
  --bg:#000;
  --surface:#1C1C1E;
  --surface-2:#2C2C2E;
  --hairline:rgba(84,84,88,.55);
  --label:#FFFFFF;
  --label-2:#98989F;
  --label-3:#5B5B60;
  --accent:#FF9F0A;
  --accent-soft:rgba(255,159,10,.16);
  --good:#30D158;
  --bad:#FF453A;
  --r:18px;
  --tab-h:52px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--label)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:17px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input{font-family:inherit;font-size:17px;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px calc(var(--tab-h) + env(safe-area-inset-bottom) + 40px);
  padding-top:calc(env(safe-area-inset-top) + 14px);
  max-width:560px;width:100%;margin:0 auto;
}
h1{
  font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px;
  margin:8px 0 2px;
}
main{display:flex;flex-direction:column}
.page{width:100%}
.page.center{margin:auto 0;padding-bottom:8px}
.page.center h1{text-align:center;margin-bottom:6px}
h1{padding-right:52px}
.page.center h1{padding:0 52px}
.sub{color:var(--label-2);font-size:15px;margin:0 0 22px}
h2{font-size:20px;font-weight:600;letter-spacing:-.2px;margin:30px 0 12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- ring ---------- */
.ring-wrap{display:flex;justify-content:center;margin:10px 0 6px}
.ring{width:min(62vw,236px);height:min(62vw,236px);position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-val{font-size:46px;letter-spacing:-1.5px;line-height:1}
.ring-cap{font-size:13px;color:var(--label-2);max-width:60%;text-align:center}
.ring-top{font-size:13px;color:var(--accent);font-weight:600}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:52px;border-radius:14px;font-weight:600;font-size:17px;
  background:var(--accent);color:#000;transition:transform .12s ease,opacity .12s ease;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--surface);color:var(--label)}
.btn.ghost{background:none;color:var(--accent);min-height:44px}
.btn.link{background:none;color:var(--label-2);min-height:42px;font-size:15px;font-weight:400}
.btn.link:active{color:var(--label)}
.btn.danger{background:var(--surface);color:var(--bad)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px}
label.btn{display:flex;cursor:pointer}

/* ---------- týden ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}
button.wd{text-align:center;background:none;padding:0;width:100%}
.wd{text-align:center}
.wd span{display:block;font-size:11px;color:var(--label-3);margin-bottom:7px}
.wd.now span{color:var(--label);font-weight:600}
.wc{
  position:relative;
  aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-variant-numeric:tabular-nums;
  background:var(--surface);color:var(--label-3);border:1.5px solid transparent;
}
.wbadge{
  position:absolute;top:-3px;right:-3px;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-style:normal;line-height:1;
  border:2px solid var(--bg);
}
.wbadge.up{background:var(--accent);color:#000}
.wbadge.down{background:var(--surface-2);color:var(--label-2)}
.wc.plan{border-color:var(--accent);color:var(--accent);background:none}
.wc.done{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}

/* ---------- progress bar ---------- */
.bar-line{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-line i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bar-head b{font-size:17px;font-weight:600}
.bar-head span{font-size:14px;color:var(--label-2)}

/* ---------- lists ---------- */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;border-bottom:.5px solid var(--hairline)}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--label-2);margin-top:2px}
.row .v{font-size:15px;color:var(--label-2);font-variant-numeric:tabular-nums;flex-shrink:0}
.chev{color:var(--label-3);flex-shrink:0}
.delta{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--label-2)}
.month-label{font-size:13px;color:var(--label-2);margin:24px 0 8px 4px}

.minibar{height:3px;border-radius:99px;background:var(--surface-2);margin-top:9px;overflow:hidden;max-width:190px}
.minibar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- chart ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--label-3);font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--label-2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- session ---------- */
.ex{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ex-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ex-h b{flex:1;font-size:16px;font-weight:600;letter-spacing:-.2px}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.set{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:9px;padding:6px 8px 6px 10px;font-size:14px;font-variant-numeric:tabular-nums;
}
.set.best{background:var(--accent-soft);color:var(--accent)}
.set button{color:var(--label-3);font-size:15px;line-height:1;padding:2px}
.steppers{display:flex;gap:8px;margin-bottom:9px}
.step{flex:1;display:flex;align-items:center;background:var(--surface-2);border-radius:12px;overflow:hidden;min-width:0}
.step button{width:40px;height:44px;font-size:20px;color:var(--accent);flex-shrink:0}
.step button:active{background:rgba(255,255,255,.06)}
.step input{
  flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;
}
.step input:focus{outline:none;color:var(--accent)}
.step .u{font-size:11px;color:var(--label-2);padding-right:9px}

/* ---------- vedený trénink ---------- */
.ghead{display:flex;align-items:center;gap:8px;margin:4px 0 20px}
.ghead .mid{flex:1;text-align:center;font-size:13px;color:var(--label-2)}
.pill{background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--label-2);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
button.pill{font-size:19px;line-height:1;padding:7px 15px;color:var(--accent)}
button.pill:active{background:var(--surface-2)}
.exname{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.6px;margin-bottom:4px}
.dots{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 14px}
.dot{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--label-3);font-variant-numeric:tabular-nums;
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.dot.on{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.repcount{font-size:15px;color:var(--label-2);margin-bottom:18px}
.repcount b{font-size:28px;letter-spacing:-.5px;color:var(--label);margin-right:2px}
.repcount.ok b{color:var(--good)}
.btn.big{min-height:82px;font-size:26px;border-radius:22px;letter-spacing:-.4px}
.quick{display:flex;gap:8px;margin-top:10px}
.qbtn{flex:1;background:var(--surface);border-radius:14px;min-height:52px;font-size:16px;color:var(--label)}
.qbtn:active{background:var(--surface-2)}
.qbtn.sm2{min-height:44px;font-size:15px;color:var(--label-2)}
.strip{margin-top:28px}
.row.cur{background:var(--surface-2)}
.tick{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--label-3);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#000;
}
.tick.on{background:var(--good);border-color:var(--good)}

/* ---------- hodiny v tréninku ---------- */
.clockbox{margin:2px 0 22px}
.clockrow{display:flex;align-items:baseline;gap:10px}
.clock{font-size:48px;line-height:1;letter-spacing:-2px;font-weight:600}
.clock.over{color:var(--accent)}
.clock.small{font-size:34px;letter-spacing:-1px}
.clocklbl{font-size:14px;color:var(--label-2)}
.clockbar{height:5px;border-radius:99px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}
.clockbar i.green{background:var(--good);transition:width .45s cubic-bezier(.22,1,.36,1)}
.donetoday{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:30px;min-height:52px;border-radius:14px;
  background:rgba(48,209,88,.13);color:var(--good);font-size:17px;font-weight:600;
}
.doneban{
  display:flex;align-items:center;justify-content:center;min-height:82px;border-radius:22px;
  background:rgba(48,209,88,.14);color:var(--good);font-size:24px;font-weight:600;letter-spacing:-.4px;
}

/* ---------- záloha ---------- */
textarea{
  width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;
  color:var(--label);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  line-height:1.45;resize:none;-webkit-user-select:text;user-select:text;
}
textarea:focus{outline:1.5px solid var(--accent)}
.bmsg{font-size:13px;color:var(--label-2);margin-top:12px;line-height:1.4}
.bmsg.good{color:var(--good)} .bmsg.bad{color:var(--bad)}

/* ---------- pocit po tréninku ---------- */
.feel{display:flex;flex-direction:column;gap:9px}
.fbtn{background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.fbtn:active{background:var(--accent);color:#000}
.fbtn b{display:block;font-size:17px;font-weight:600}
.fbtn span{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.fbtn:active span{color:rgba(0,0,0,.6)}
.arrow{width:26px;flex-shrink:0;font-size:17px;font-weight:600;text-align:center}
.arrow.up{color:var(--accent)} .arrow.down{color:var(--label-2)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--surface-2);border-radius:99px;padding:9px 14px;font-size:14px}
.chip:active{background:var(--accent);color:#000}

/* ---------- tabbar ---------- */
.notesbtn{
  position:fixed;z-index:35;
  top:calc(env(safe-area-inset-top) + 14px);right:16px;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--label-2);
}
.notesbtn:active{background:var(--surface-2);color:var(--accent)}
.notesbtn svg{width:20px;height:20px}
.notesbtn i{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  background:rgba(18,18,20,.82);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--hairline);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--label-3);font-size:10px;font-weight:500}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}

/* ---------- sheet ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;transition:opacity .25s ease;backdrop-filter:blur(2px)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:#161618;border-radius:22px 22px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
  max-height:88dvh;overflow-y:auto;
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  max-width:560px;margin:0 auto;
}
.open .scrim{opacity:1}
.open .sheet{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:99px;background:var(--surface-2);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.2px}
.sheet h3.bigwin{font-size:26px;letter-spacing:-.5px}
.sheet p.hint{color:var(--label-2);font-size:14px;margin:0 0 18px}
.field{background:var(--surface);border-radius:12px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.field label{font-size:15px;color:var(--label-2);flex-shrink:0}
.field input{flex:1;min-width:0;background:none;border:0;text-align:right;font-size:17px}
.field input:focus{outline:none}
.field input[type=date]{text-align:right;color:var(--label)}

.empty{text-align:center;color:var(--label-2);font-size:15px;padding:34px 20px;line-height:1.5}
.skeleton{padding:80px 0;text-align:center;color:var(--label-3)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"><div class="skeleton">Načítám…</div></main>
  <button id="notesbtn" class="notesbtn hidden" aria-label="Nápady">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 9.5 9.5 0 0 1-2.8-.4L3 21l1.7-4.9A8.2 8.2 0 0 1 3.7 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
    <i id="notesdot" class="hidden"></i>
  </button>
  <nav id="nav" class="hidden">
    <button data-tab="today" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 6.9 4" stroke-width="3" stroke-linecap="round"/></svg>
      Dnes</button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 5 9l2.5-2.5M3.5 16.5 5 18l2.5-2.5"/><path d="M11 8h9.5M11 17h9.5"/></svg>
      Plán</button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5 8.5 11l3.5 3.5L21 6"/><path d="M21 6h-4.5M21 6v4.5"/></svg>
      Přehled</button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      Historie</button>
  </nav>
</div>
<div id="modal" class="hidden">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
"use strict";

/* ============ storage ============ */
var KEY = "gymlog:v2";
var DB = { v:2, workouts:[], active:null, levels:{}, lvlAge:{}, credit:{}, feel:null, sinceChange:0, backupAt:0, notes:[], fpu:null, settings:{ targetMinutes:30, intervalDays:2 } };
var saveTimer = null, booted = false;

var store = {
  get: async function(){
    if (window.storage) {
      try { var r = await window.storage.get(KEY, false); return r && r.value ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try { var v = window.localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  set: async function(obj){
    var s = JSON.stringify(obj);
    if (window.storage) {
      try { await window.storage.set(KEY, s, false); return true; } catch(e){ console.error("save failed", e); return false; }
    }
    try { window.localStorage.setItem(KEY, s); return true; } catch(e){ return false; }
  }
};
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(function(){ store.set(DB); }, 350); }
/* Bez čekání — pro věci, které nesmí zmizet (zapsaná série, odchod z appky). */
function saveNow(){ clearTimeout(saveTimer); try { return store.set(DB); } catch(e){ return null; } }

/* ============ date helpers ============ */
function dk(d){ var x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function pd(k){ var p=String(k).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today(){ return dk(new Date()); }
function addDays(k,n){ var d=pd(k); d.setDate(d.getDate()+n); return dk(d); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function startOfWeek(d){ var x=new Date(d); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
var fmtLong = new Intl.DateTimeFormat("cs-CZ",{weekday:"long", day:"numeric", month:"long"});
var fmtShort = new Intl.DateTimeFormat("cs-CZ",{day:"numeric", month:"numeric"});
var DAY_LOC = ["v neděli","v pondělí","v úterý","ve středu","ve čtvrtek","v pátek","v sobotu"];
var fmtMonth = new Intl.DateTimeFormat("cs-CZ",{month:"long", year:"numeric"});
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ============ math ============ */
function volumeOf(w){
  var t=0;
  (w.exercises||[]).forEach(function(e){ (e.sets||[]).forEach(function(s){ t += (Number(s.w)||0) * (Number(s.r)||0); }); });
  return t;
}
function repsOf(w){
  var t=0;
  (w.exercises||[]).forEach(function(e){ (e.sets||[]).forEach(function(s){ t += Number(s.r)||0; }); });
  return t;
}
/* Epleyho odhad má smysl jen do ~12 opakování; nad tím ho nepočítáme. */
function e1rm(s){ var w=Number(s.w)||0, r=Number(s.r)||0; return (w>0 && r>0 && r<=12) ? w*(1+r/30) : 0; }
function sorted(){ return DB.workouts.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function fmtKg(n){
  if (n >= 10000) return (n/1000).toFixed(1).replace(".",",")+" t";
  return Math.round(n).toLocaleString("cs-CZ")+" kg";
}
function fmtKgShort(n){
  if (n >= 1000) return (n/1000).toFixed(1).replace(".",",")+" t";
  return Math.round(n)+" kg";
}
function nice(n){ return (Math.round(n*10)/10).toString().replace(".",","); }
/* 1 trénink / 2–4 tréninky / 5+ tréninků */
function pl(n, one, few, many){ return n===1 ? one : (n>=2 && n<=4) ? few : many; }
function nPl(n, one, few, many){ return n+" "+pl(n, one, few, many); }

function nextDue(){
  var s = sorted();
  if (!s.length) return today();
  return addDays(s[s.length-1].date, DB.settings.intervalDays);
}
function weekSeries(n){
  var out=[], base=startOfWeek(new Date());
  for (var i=n-1;i>=0;i--){
    var st=new Date(base); st.setDate(st.getDate()-i*7);
    var en=new Date(st); en.setDate(en.getDate()+6);
    var a=dk(st), b=dk(en);
    out.push({ start:a, end:b, count: DB.workouts.filter(function(w){ return w.date>=a && w.date<=b; }).length });
  }
  return out;
}
function weekPlan(){
  var mon=startOfWeek(new Date()), sun=new Date(mon); sun.setDate(sun.getDate()+6);
  var a=dk(mon), b=dk(sun);
  var done=DB.workouts.filter(function(w){ return w.date>=a && w.date<=b; }).length;
  var d=nextDue(); if (d < today()) d=today();
  var rem=0;
  while (d<=b && rem<10){ rem++; d=addDays(d, DB.settings.intervalDays); }
  return { done:done, rem:rem, total:done+rem };
}
function weekDays(){
  var mon=startOfWeek(new Date()), sunD=new Date(mon); sunD.setDate(sunD.getDate()+6);
  var sun=dk(sunD), plan={}, d=nextDue(), guard=0;
  if (d < today()) d=today();
  while (d<=sun && guard++<10){ plan[d]=1; d=addDays(d, DB.settings.intervalDays); }
  var wd=["po","út","st","čt","pá","so","ne"], out=[];
  for (var i=0;i<7;i++){
    var x=new Date(mon); x.setDate(x.getDate()+i);
    var k=dk(x);
    out.push({ key:k, day:x.getDate(), wd:wd[i], today:k===today(),
               done:DB.workouts.some(function(w){ return w.date===k; }), plan:!!plan[k] });
  }
  return out;
}
function monthGoal(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var days=new Date(y,m+1,0).getDate();
  var goal=Math.round(days/DB.settings.intervalDays);
  var pre=y+"-"+String(m+1).padStart(2,"0");
  var done=DB.workouts.filter(function(w){ return w.date.indexOf(pre)===0; }).length;
  return { done:done, goal:goal, label:cap(fmtMonth.format(now)) };
}
function exerciseStats(){
  var map={};
  sorted().forEach(function(w){
    (w.exercises||[]).forEach(function(e){
      var best=0, vol=0;
      (e.sets||[]).forEach(function(s){ best=Math.max(best,e1rm(s)); vol+=(Number(s.w)||0)*(Number(s.r)||0); });
      if (!map[e.name]) map[e.name]={ name:e.name, points:[] };
      map[e.name].points.push({ date:w.date, best:best, vol:vol });
    });
  });
  return Object.keys(map).map(function(k){
    var o=map[k], p=o.points;
    var q=p.filter(function(x){ return x.best>0; });   /* jen série do 12 opakování */
    var first=q.length?q[0].best:0, last=q.length?q[q.length-1].best:0;
    var peak=p.reduce(function(m,x){ return Math.max(m,x.best); },0);
    var delta = q.length>=2 && first>0 ? (last-first)/first*100 : 0;
    return { name:o.name, points:p, rated:q.length, first:first, last:last, peak:peak, delta:delta, count:p.length, lastDate:p[p.length-1].date };
  }).sort(function(a,b){ return a.lastDate<b.lastDate?1:a.lastDate>b.lastDate?-1:0; });
}
function lastSetOf(name){
  var s=sorted().reverse();
  for (var i=0;i<s.length;i++){
    var ex=(s[i].exercises||[]).filter(function(e){ return e.name===name; })[0];
    if (ex && ex.sets && ex.sets.length) return ex.sets[ex.sets.length-1];
  }
  return null;
}

/* Fighter Pull-Up Program (Pavel Tsatsouline, podle kb5.cz).
   5 sérií, klesající žebřík. Každý další tréninkový den se odspodu "dorovnává"
   o jeden krok. Po pátém dni se základ zvedne o krok a jede se dál. */
var FPU_NAME="Shyby";
function fpuStep(max){ return max<=10 ? 1 : (max<=20 ? 2 : 4); }
function fpuStart(max){ return max<=10 ? max : Math.round(max*0.8); }
function fpuLadder(start, step, day){
  var l=[];
  for (var i=0;i<5;i++) l.push(Math.max(1, start-i*step));
  for (var j=0;j<day;j++) l[4-j]=l[4-j]+step;   /* posledních `day` sérií o krok výš */
  return l;
}
function fpuToday(){
  var f=DB.fpu;
  if (!f || !f.max) return null;
  return { ladder:fpuLadder(f.start, f.step, f.day||0), day:(f.day||0)+1, cycle:(f.cycle||0)+1 };
}
function fpuInit(max){
  max=Math.max(1, Math.min(40, parseInt(max,10)||5));
  DB.fpu={ max:max, start:fpuStart(max), step:fpuStep(max), day:0, cycle:0 };
}
function fpuAdvance(){
  var f=DB.fpu; if (!f || !f.max) return;
  f.day=(f.day||0)+1;
  if (f.day>4){ f.day=0; f.cycle=(f.cycle||0)+1; f.start+=f.step; }
}

function planIndex(name){ for (var i=0;i<PLAN.length;i++) if (PLAN[i].n===name) return i; return -1; }

/* Dlouhodobá automatika.
   Každý cvik si sbírá kredit podle toho, jak trénink šel. Úroveň se zvedne teprve
   když kredit dosáhne prahu — a práh s každou úrovní roste, takže progrese
   přirozeně zpomaluje. Navíc: minimálně 4 tréninky na úrovni a nejvýš
   jedna změna za trénink. Celý žebřík je tak na měsíce, ne na týdny. */
var CREDIT_MIN_SESSIONS = 5;      /* nejdřív po 5 trénincích na dané úrovni */
var CREDIT_DOWN_AT      = -6;     /* tři špatné tréninky v řadě = o úroveň zpět */
var CHANGE_COOLDOWN     = 3;      /* mezi dvěma změnami aspoň 3 tréninky */
function threshold(i){ return 18 + 6*lvl(i); }
function creditOf(n){ return DB.credit[n]||0; }
function gainFor(feeling, met, ratio){
  if (met) return feeling==="easy" ? 3 : feeling==="mid" ? 2 : 1;
  return ratio>=0.8 ? 0 : -2;
}

function autoAdjust(feeling, session){
  var stat=session.map(function(e){
    var d=0; (e.sets||[]).forEach(function(x){ d+=Number(x.r)||0; });
    var t=e.target||30;
    return { i:planIndex(e.name), name:e.name, ratio:t?d/t:0, met:d>=t };
  }).filter(function(x){ return x.i>=0 && x.ratio>0 && !(x.name===FPU_NAME && DB.fpu && DB.fpu.max); });

  stat.forEach(function(x){
    DB.lvlAge[x.name]=(DB.lvlAge[x.name]||0)+1;
    DB.credit[x.name]=creditOf(x.name)+gainFor(feeling, x.met, x.ratio);
  });

  var out=[];
  DB.sinceChange=(DB.sinceChange||0)+1;
  if (DB.sinceChange < CHANGE_COOLDOWN){ DB.feel=feeling; return out; }
  var down=stat.filter(function(x){ return creditOf(x.name)<=CREDIT_DOWN_AT && lvl(x.i)>0; })
               .sort(function(a,b){ return creditOf(a.name)-creditOf(b.name); })[0];
  if (down){
    DB.levels[down.name]=lvl(down.i)-1;
    DB.lvlAge[down.name]=0;
    DB.credit[down.name]=Math.round(threshold(down.i)/2);
    DB.sinceChange=0;
    out.push({ name:down.name, dir:-1, to:lvLabel(PLAN[down.i].lv[lvl(down.i)]) });
  } else {
    var up=stat.filter(function(x){
      return lvl(x.i) < PLAN[x.i].lv.length-1 &&
             DB.lvlAge[x.name] >= CREDIT_MIN_SESSIONS &&
             creditOf(x.name) >= threshold(x.i);
    }).sort(function(a,b){ return (creditOf(b.name)-threshold(b.i))-(creditOf(a.name)-threshold(a.i)); })[0];
    if (up){
      DB.levels[up.name]=lvl(up.i)+1;
      DB.lvlAge[up.name]=0;
      DB.credit[up.name]=0;
      DB.sinceChange=0;
      out.push({ name:up.name, dir:1, to:lvLabel(PLAN[up.i].lv[lvl(up.i)]) });
    }
  }
  DB.feel=feeling;
  return out;
}

/* Odhad, co udělá nejbližší trénink, když půjde "akorát". Pro šipku u dne. */
function nextHint(){
  if ((DB.sinceChange||0)+1 < CHANGE_COOLDOWN) return 0;
  for (var i=0;i<PLAN.length;i++){
    var n=PLAN[i].n;
    if (creditOf(n) <= CREDIT_DOWN_AT+2 && lvl(i)>0) return -1;
  }
  for (var j=0;j<PLAN.length;j++){
    var m=PLAN[j].n;
    if (lvl(j) < PLAN[j].lv.length-1 &&
        (DB.lvlAge[m]||0)+1 >= CREDIT_MIN_SESSIONS &&
        creditOf(m)+2 >= threshold(j)) return 1;
  }
  return 0;
}

function lvl(i){ var v=DB.levels[PLAN[i].n]; return Math.max(0, Math.min(PLAN[i].lv.length-1, v==null?0:v)); }
function lvLabel(x){ return x.s+"×"+x.r+(x.w?" · "+nice(x.w)+" kg":"")+(x.t?" · "+x.t:""); }

/* ============ svg helpers ============ */
function smooth(pts){
  if (pts.length<2) return "";
  var d="M"+pts[0].x+","+pts[0].y, t=.2;
  for (var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    var c1x=p1.x+(p2.x-p0.x)*t, c1y=p1.y+(p2.y-p0.y)*t;
    var c2x=p2.x-(p3.x-p1.x)*t, c2y=p2.y-(p3.y-p1.y)*t;
    d+=" C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
  }
  return d;
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function ring(pct, mid, cap_, top){

  return '<div class="ring-wrap"><div class="ring">'+
    '<svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="'+R+'" fill="none" stroke-width="15"/>'+
    '<circle class="bar" cx="100" cy="100" r="'+R+'" fill="none" stroke-width="15" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'"/></svg>'+
    '<div class="ring-mid">'+(top?'<div class="ring-top">'+top+'</div>':'')+
    '<div class="ring-val num">'+mid+'</div><div class="ring-cap">'+cap_+'</div></div></div></div>';
}

    else if (x.plan && !hinted && hint){ badge=hint; hinted=true; }
    h+='<button class="wd'+(x.today?" now":"")+'" data-act="day" data-k="'+x.key+'">'+
       '<span>'+x.wd+'</span><div class="wc '+cls+'">'+(x.done?"✓":x.day)+
       (badge?'<i class="wbadge '+(badge>0?"up":"down")+'">'+(badge>0?"⬆":"⬇")+'</i>':'')+
       '</div></button>';
  });
  h+='</div>';
  var doneToday=DB.workouts.some(function(w){ return w.date===today(); });
  h+= doneToday
    ? '<div class="donetoday"><span class="tick on">✓</span> Dnes splněno</div>'
    : '<button class="btn" style="margin-top:30px" data-act="start">Začít trénink</button>';
  h+='<button class="btn link" data-act="manual">Nahrát manuálně</button>';
  return h;
}

function viewStats(){
  var h='<h1>Přehled</h1>';
  if (DB.workouts.length<1) return h+'<p class="sub">Trend se objeví po prvním zápisu.</p><div class="empty">Zatím tu nic není.<br>Zapiš trénink a graf začne růst.</div>';
  h+='<p class="sub">Cíl: '+DB.settings.targetMinutes+' minut každý '+DB.settings.intervalDays+'. den</p>';

  var yr=String(new Date().getFullYear());
  var yrN=DB.workouts.filter(function(w){ return w.date.indexOf(yr)===0; }).length;
  var yrMin=DB.workouts.filter(function(w){ return w.date.indexOf(yr)===0; })
                       .reduce(function(t,w){ return t+(w.minutes||0); },0);
  h+='<div class="card" style="margin-bottom:14px"><div class="bar-head" style="margin-bottom:2px">'+
     '<b style="font-size:28px;letter-spacing:-.6px" class="num">'+yrN+'</b><span>'+yr+'</span></div>'+
     '<div style="font-size:14px;color:var(--label-2)">'+pl(yrN,"trénink letos","tréninky letos","tréninků letos")+
     (yrMin>=60 ? ' · '+nPl(Math.round(yrMin/60),"hodina","hodiny","hodin")+' u toho' : '')+'</div></div>';

  /* monthly progress bar */
  var mg=monthGoal(), pct=Math.min(mg.done/mg.goal,1);
  h+='<div class="card"><div class="bar-head"><b>'+mg.label+'</b><span>'+mg.done+' z '+mg.goal+'</span></div>'+
     '<div class="bar-line"><i style="width:0" data-w="'+(pct*100).toFixed(1)+'%"></i></div>'+
     '<div style="font-size:13px;color:var(--label-2);margin-top:9px">'+
     (mg.done>=mg.goal ? "Cíl měsíce splněný." : pl(mg.goal-mg.done,"Zbývá","Zbývají","Zbývá")+" "+nPl(mg.goal-mg.done,"trénink","tréninky","tréninků")+" do konce měsíce.")+'</div></div>';

  /* frequency chart */
  var ws=weekSeries(12);
  var W=340, H=140, PL=6, PR=6, PT=14, PB=20;
  var maxC=Math.max(4, Math.max.apply(null, ws.map(function(x){ return x.count; }))+1);
  var stepX=(W-PL-PR)/(ws.length-1);
  var y=function(v){ return PT+(H-PT-PB)*(1-v/maxC); };
  var pts=ws.map(function(x,i){ return { x:PL+i*stepX, y:y(x.count) }; });
  var line=smooth(pts);
  var area=line+" L"+pts[pts.length-1].x+","+(H-PB)+" L"+pts[0].x+","+(H-PB)+" Z";
  var tgt=7/DB.settings.intervalDays;

  h+='<h2>Jak často chodím</h2><div class="card">'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Počet tréninků v posledních 12 týdnech">'+
    '<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="var(--accent)" stop-opacity=".34"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+PL+'" y1="'+y(tgt).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y(tgt).toFixed(1)+'" stroke="var(--label-3)" stroke-width="1" stroke-dasharray="3 4"/>'+
    '<path d="'+area+'" fill="url(#fg)"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map(function(p,i){ return i===pts.length-1 ? '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="var(--accent)"/>' : ""; }).join("")+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--label-3);margin-top:4px">'+
    '<span>'+fmtShort.format(pd(ws[0].start))+'</span><span>tento týden</span></div>'+
    '<div class="legend"><span><i style="background:var(--accent)"></i>tréninky za týden</span>'+
    '<span><i style="background:var(--label-3)"></i>cíl '+nice(tgt)+'×</span></div></div>';

  /* volume chart */
  var vs=sorted().filter(function(w){ return volumeOf(w)>0; }).slice(-20);
  if (vs.length>=2){
    var maxV=Math.max.apply(null, vs.map(volumeOf))*1.12;
    var sx=(W-PL-PR)/(vs.length-1);
    var vp=vs.map(function(w,i){ return { x:PL+i*sx, y:PT+(H-PT-PB)*(1-volumeOf(w)/maxV) }; });
    var vl=smooth(vp);
    /* průměr prvních vs. posledních N tréninků – odolnější než porovnání dvou jednotlivých dnů */
    var N=Math.max(1, Math.min(5, Math.floor(vs.length/2)));
    var avg=function(arr){ return arr.reduce(function(t,w){ return t+volumeOf(w); },0)/arr.length; };
    var a0=avg(vs.slice(0,N)), a1=avg(vs.slice(-N));
    var dv=a0>0?(a1-a0)/a0*100:0;
    h+='<h2>Jak se zlepšuju</h2><div class="card">'+
      '<div class="bar-head"><b>'+fmtKg(a1)+'</b><span class="delta '+(dv>1?"up":dv<-1?"down":"flat")+'">'+(dv>0?"+":"")+Math.round(dv)+' %</span></div>'+
      '<div style="font-size:13px;color:var(--label-2);margin:-4px 0 12px">průměr posledních '+nPl(N,"tréninku","tréninků","tréninků")+' oproti prvním '+N+' v grafu</div>'+
      '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Odtrénovaný objem v posledních '+vs.length+' trénincích">'+
      '<defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#0A84FF" stop-opacity=".3"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+vl+' L'+vp[vp.length-1].x+','+(H-PB)+' L'+vp[0].x+','+(H-PB)+' Z" fill="url(#vg)"/>'+
      '<path d="'+vl+'" fill="none" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle cx="'+vp[vp.length-1].x.toFixed(1)+'" cy="'+vp[vp.length-1].y.toFixed(1)+'" r="4" fill="#0A84FF"/>'+
      '</svg><div class="legend"><span><i style="background:#0A84FF"></i>odtrénovaný objem (kg × opakování)</span></div></div>';
  }

  /* per exercise */
  var ex=exerciseStats();
  if (ex.length){
    h+='<h2>Cviky</h2><div class="list">';
    ex.slice(0,12).forEach(function(e){
      var cls=e.delta>1.5?"up":e.delta<-1.5?"down":"flat";
      var d = e.count<2 ? '<span class="delta flat">1. zápis</span>'
            : e.rated<2 ? '<span class="delta flat">'+fmtKgShort(e.points[e.points.length-1].vol)+'</span>'
            : '<span class="delta '+cls+'">'+(e.delta>0?"+":"")+Math.round(e.delta)+' %</span>';
      h+='<div class="row"><div class="g"><div class="t">'+esc(e.name)+'</div>'+
        '<div class="s">'+(e.peak>0?"odhad max "+Math.round(e.peak)+" kg · ":"")+e.count+"× zapsáno"+'</div></div>'+d+'</div>';
    });
    h+='</div><p style="font-size:12px;color:var(--label-3);margin-top:10px;line-height:1.5">Odhad maxima počítá Epleyho vzorec (váha × (1 + opakování ÷ 30)) a bere jen série do 12 opakování — nad nimi přestávají být tyhle vzorce spolehlivé. U cviků s vlastní vahou a u delších sérií se místo odhadu ukazuje objem poslední série.</p>';
  }
  return h;
}

function viewHistory(){

function buildSession(){
  return PLAN.map(function(p,k){
    if (p.n===FPU_NAME){
      var f=fpuToday();
      if (f){
        var sum=f.ladder.reduce(function(t,n){ return t+n; },0);
        return { name:p.n, sets:[], target:sum, ladder:f.ladder,
                 plan:{s:5,r:f.ladder[0],w:0},
                 hint:"Fighter Pull-Up · cyklus "+f.cycle+", den "+f.day+" · "+f.ladder.join(", "),
                 draft:{ w:0, r:f.ladder[0] } };
      }
    }
    var x=p.lv[lvl(k)];
    return { name:p.n, sets:[], target:x.s*x.r, plan:{s:x.s,r:x.r,w:x.w},
             hint:lvLabel(x), draft:{ w:x.w, r:x.r } };
  });
}
function repsIn(e){ var t=0; (e.sets||[]).forEach(function(x){ t+=Number(x.r)||0; }); return t; }
function nextReps(e){
  if (e.ladder) return e.ladder[Math.min(e.sets.length, e.ladder.length-1)];
  return parseInt(e.draft.r,10)||1;
}
function allDone(){
  var xs=(DB.active&&DB.active.exercises)||[];
  return xs.length>0 && xs.every(function(x){ return repsIn(x)>=(x.target||30); });
}
function cur(){ var A=DB.active; return A.exercises[Math.max(0,Math.min(A.exercises.length-1,A.idx||0))]; }
/* Po dokončení cviku chvíli ukáže "Hotovo" a sám přejde dál.
   Když je hotové všechno, rovnou uzavře trénink. */
var advTimer=null;
function queueAdvance(){
  clearTimeout(advTimer);
  var wait = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 250 : 850;
  advTimer=setTimeout(function(){
    if (!DB.active) return;
    if (allDone()){ celebrate(); sheetFinish(true); return; }
    var xs=DB.active.exercises, n=xs.length, from=DB.active.idx||0;
    for (var k=1;k<=n;k++){
      var j=(from+k)%n;
      if (repsIn(xs[j]) < (xs[j].target||30)){ DB.active.idx=j; saveNow(); render(); scrollTop(); return; }
    }
  }, wait);
}
function scrollTop(){ var m=document.getElementById("main"); if(m) m.scrollTop=0; }

/* ============ render ============ */
function render(){
  var m=document.getElementById("main");
  var body = tab==="today" ? viewToday() : tab==="plan" ? viewPlan() : tab==="stats" ? viewStats() : viewHistory();
  m.innerHTML = '<div class="page'+((tab==="today" && !DB.active) ? " center" : "")+'">'+body+'</div>';
  document.getElementById("nav").classList.remove("hidden");
  var nb=document.getElementById("notesbtn");
  nb.classList.remove("hidden");
  document.getElementById("notesdot").classList.toggle("hidden", DB.notes.length===0);
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.classList.toggle("on", b.dataset.tab===tab);
  });
  requestAnimationFrame(function(){
    Array.prototype.forEach.call(m.querySelectorAll(".ring .bar"), function(c){ c.setAttribute("stroke-dashoffset", c.dataset.off); });
    Array.prototype.forEach.call(m.querySelectorAll(".bar-line i"), function(c){ c.style.width=c.dataset.w; });
  });
  clearInterval(tick);
  if (DB.active && !DB.active.manual && tab==="today"){
    tick=setInterval(function(){
      if (!DB.active){ clearInterval(tick); return; }   /* trénink mezitím uložen nebo zahozen */
      var el=document.getElementById("clock");
      if (!el) return;
      var mins=(Date.now()-DB.active.startedAt)/60000;
      el.textContent=Math.floor(mins)+":"+String(Math.floor((mins-Math.floor(mins))*60)).padStart(2,"0");
      el.classList.toggle("over", mins>=DB.settings.targetMinutes);
      var cb=document.getElementById("clockbar");
      if (cb) cb.style.width=(Math.min(mins/DB.settings.targetMinutes,1)*100).toFixed(1)+"%";
    }, 1000);
  }
}

/* ============ konfety ============ */
function celebrate(){
  try {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var old=document.getElementById("confetti"); if (old) old.remove();
    var cv=document.createElement("canvas");
    cv.id="confetti";
    document.body.appendChild(cv);
    var ctx=cv.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1, 2);
    var W=cv.clientWidth, H=cv.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);

    var COLORS=["#FF9F0A","#FFD60A","#30D158","#FFFFFF","#64D2FF"];
    var P=[], N=110;
    for (var i=0;i<N;i++){
      P.push({
        x: W*(0.15+0.7*Math.random()),
        y: H*0.42 + (Math.random()*40-20),
        vx: (Math.random()-0.5)*9,
        vy: -7-Math.random()*9,
        w: 5+Math.random()*6,
        h: 8+Math.random()*7,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.34,
        c: COLORS[(Math.random()*COLORS.length)|0],
        sway: Math.random()*Math.PI*2
      });
    }
    var t0=performance.now(), DUR=2600;
    (function frame(now){
      var el=now-t0;
      if (el>DUR || !document.getElementById("confetti")){ cv.remove(); return; }
      ctx.clearRect(0,0,W,H);
      var fade = el>DUR-700 ? Math.max(0,(DUR-el)/700) : 1;
      for (var j=0;j<P.length;j++){
        var p=P[j];
        p.vy += 0.32;                    /* gravitace */
        p.vx *= 0.995;
        p.sway += 0.09;
        p.x += p.vx + Math.sin(p.sway)*0.7;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y>H+40) continue;
        ctx.save();
        ctx.globalAlpha=fade;
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle=p.c;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.6)));
        ctx.restore();
      }
      requestAnimationFrame(frame);
    })(t0);
  } catch(e){}
}

function sheetBackup(){
  var dump=backupBlob();
  openSheet(
    '<h3>Záloha</h3><p class="hint">'+nPl(DB.workouts.length,"trénink","tréninky","tréninků")+
    ' a všechny úrovně. Stáhni si soubor do iCloudu, nebo zkopíruj text do poznámek.</p>'+
    '<button class="btn" id="bdl">Stáhnout soubor</button>'+
    '<button class="btn sec" id="bcopy" style="margin-top:9px">Zkopírovat jako text</button>'+
    '<textarea id="bk" readonly rows="3" style="margin-top:10px">'+esc(dump)+'</textarea>'+
    '<h3 style="margin-top:26px">Obnovit</h3><p class="hint">Přepíše všechno, co je teď v appce.</p>'+
    '<label class="btn sec" for="bfile">Načíst ze souboru</label>'+
    '<input type="file" id="bfile" accept="application/json,.json" style="display:none">'+
    '<textarea id="rs" rows="3" placeholder="…nebo sem vlož zkopírovaný text" style="margin-top:10px"></textarea>'+
    '<button class="btn sm sec" id="rgo" style="margin-top:9px">Obnovit z textu</button>'+
    '<div id="bmsg" class="bmsg"></div>',
    function(sh){
      var msg=sh.querySelector("#bmsg");
      function say(t,cls){ msg.textContent=t; msg.className="bmsg"+(cls?" "+cls:""); }

      sh.querySelector("#bdl").addEventListener("click", function(){
        try {
          var blob=new Blob([dump], {type:"application/json"});
          var url=URL.createObjectURL(blob);
          var a=document.createElement("a");
          a.href=url; a.download="trenink-zaloha-"+today()+".json";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
          DB.backupAt=DB.workouts.length; saveNow();
          say("Staženo. Ulož si to do Souborů nebo iCloudu.","good");
        } catch(e){
          say("Stažení tady nejde — použij zkopírování textu.","bad");
        }
      });

      sh.querySelector("#bcopy").addEventListener("click", function(){
        var ta=sh.querySelector("#bk");
        ta.select(); ta.setSelectionRange(0, 999999);
        var ok=false; try { ok=document.execCommand("copy"); } catch(e){}
        function done(){ DB.backupAt=DB.workouts.length; saveNow(); say("Zkopírováno.","good"); }
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(dump).then(done, function(){
            if (ok) done(); else say("Text je označený — podrž prst a dej Kopírovat.","");
          });
        } else if (ok) done();
        else say("Text je označený — podrž prst a dej Kopírovat.","");
      });

      sh.querySelector("#bfile").addEventListener("change", function(ev){
        var f=ev.target.files && ev.target.files[0];
        if (!f) return;
        var rd=new FileReader();
        rd.onload=function(){
          var o=null;
          try { o=JSON.parse(rd.result); } catch(e){ return say("Soubor není platná záloha.","bad"); }
          if (!applyBackup(o)) return say("V souboru chybí tréninky.","bad");
          saveNow(); closeSheet(); tab="history"; render();
        };
        rd.onerror=function(){ say("Soubor se nepodařilo přečíst.","bad"); };
        rd.readAsText(f);
      });

      sh.querySelector("#rgo").addEventListener("click", function(){
        var raw=sh.querySelector("#rs").value.trim();
        if (!raw) return say("Nejdřív vlož zálohu.","bad");
        var o=null;
        try { o=JSON.parse(raw); } catch(e){ return say("Tohle není platná záloha.","bad"); }
        if (!applyBackup(o)) return say("V záloze chybí tréninky.","bad");
        saveNow(); closeSheet(); tab="history"; render();
      });
    }
  );
}

  var dEl=sh.querySelector("#fdate"), mEl=sh.querySelector("#fmin");
  var date=(dEl && dEl.value) || (DB.active.manual ? (DB.active.date||today()) : today());

  if (isNaN(m)||m<1) m = DB.active.manual ? (DB.active.minutes||DB.settings.targetMinutes)
                     : Math.max(1, Math.round((Date.now()-DB.active.startedAt)/60000));
  var session=(DB.active.exercises||[]).filter(function(e){ return e.sets.length; });
  var changes=autoAdjust(feeling, session);
  if (DB.fpu && DB.fpu.max && session.some(function(e){ return e.name===FPU_NAME; })) fpuAdvance();
  DB.workouts.push({ id:"w"+Date.now(), date:date, minutes:m, feel:feeling,
                     chg:(changes[0]?changes[0].dir:0),
                     exercises:session.map(function(e){ return { name:e.name, sets:e.sets }; }) });
  DB.active=null; clearInterval(tick); clearTimeout(advTimer); save();

  var body = changes.length
    ? '<div class="list">'+changes.map(function(c){
        return '<div class="row"><span class="arrow '+(c.dir>0?"up":"down")+'">'+(c.dir>0?"↑":"↓")+'</span>'+

            ? "Zatím neubírám. Když to bude těžké i příště, jeden cvik shodím o úroveň."

        : "Plán zůstává stejný. Dej to ještě jednou takhle a příště se přitvrdí.")+'</div>';
  sh.innerHTML='<div class="grab"></div><h3>Uloženo</h3><p class="hint">'+
    (changes.length ? "Příští trénink bude jinak:" : "Zapsáno.")+'</p>'+body+

           '<div class="s">'+esc(lvLabel(x))+'</div></div>'+

  }).join("");

  openSheet('<h3>'+cap(fmtLong.format(pd(k)))+'</h3>'+
    '<p class="hint">Co tě '+when+' čeká · '+totS+' sérií · '+totR+' opakování</p>'+
    '<div class="list">'+rows+'</div>'+

document.addEventListener("click", function(ev){
  var t=ev.target.closest("[data-act],[data-tab]");
  if (!t) return;
  if (t.dataset.tab){ tab=t.dataset.tab; document.getElementById("main").scrollTop=0; render(); return; }
  var a=t.dataset.act, i=parseInt(t.dataset.i,10), ex=DB.active?DB.active.exercises[i]:null;

  if (a==="start"){
    DB.active={ startedAt:Date.now(), manual:false, idx:0, exercises:buildSession() };
    saveNow(); render(); scrollTop();
  }
  else if (a==="manual") sheetManual();
  else if (a==="lvl") sheetLevels(i);
  else if (a==="fpu") sheetFpu();
  else if (a==="day") sheetDay(t.dataset.k);
  else if (a==="backup") sheetBackup();
  else if (a==="log"){
    var e0=cur();
    e0.sets.push({ w:Number(String(e0.draft.w).replace(",","."))||0, r:nextReps(e0) });
    saveNow(); render();
    if (repsIn(e0) >= (e0.target||30)) queueAdvance();
  }
  else if (a==="undo"){ clearTimeout(advTimer); var e1=cur(); e1.sets.pop(); saveNow(); render(); }
  else if (a==="rep"){
    var e2=cur(), d=parseInt(t.dataset.d,10);
    e2.draft.r=Math.max(1, (parseInt(e2.draft.r,10)||1)+d);
    save(); render();
  }
  else if (a==="kg"){
    var e3=cur(), dw=Number(t.dataset.d);
    e3.draft.w=Math.max(0, Math.round(((Number(String(e3.draft.w).replace(",","."))||0)+dw)*10)/10);
    save(); render();
  }
  else if (a==="next"){ clearTimeout(advTimer); DB.active.idx=Math.min(DB.active.exercises.length-1,(DB.active.idx||0)+1); save(); render(); scrollTop(); }
  else if (a==="prev"){ clearTimeout(advTimer); DB.active.idx=Math.max(0,(DB.active.idx||0)-1); save(); render(); scrollTop(); }
  else if (a==="jump"){ clearTimeout(advTimer); DB.active.idx=i; save(); render(); scrollTop(); }
  else if (a==="finish"){
    var any=(DB.active.exercises||[]).some(function(e){ return e.sets.length; });
    if (!any){ openSheet('<h3>Prázdný trénink</h3><p class="hint">Zapiš aspoň jednu sérii, jinak není co uložit.</p><button class="btn sec" id="ok">Zpět</button>', function(sh){ sh.querySelector("#ok").addEventListener("click", closeSheet); }); return; }
    sheetFinish();
  }
  else if (a==="discard"){
    openSheet('<h3>Zahodit trénink?</h3><p class="hint">Zapsané série se neuloží.</p><button class="btn danger" id="yes">Zahodit</button><button class="btn ghost" id="no">Pokračovat v tréninku</button>',
      function(sh){
        sh.querySelector("#yes").addEventListener("click", function(){ DB.active=null; save(); closeSheet(); render(); });
        sh.querySelector("#no").addEventListener("click", closeSheet);
      });
  }
  else if (a==="open") sheetWorkout(t.dataset.id);
});

/* Offline režim. Registruje se jen na hostované stránce přes https,
   v náhledu uvnitř Claude se přeskočí. */
(function(){
  try {
    if (!("serviceWorker" in navigator)) return;
    if (window.top !== window.self) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  } catch(e){}
})();

/* ============ boot ============ */
(async function boot(){
  var d=await store.get();
  if (d && d.workouts) DB=Object.assign(DB, d, { settings:Object.assign(DB.settings, d.settings||{}) });
  if (!DB.levels) DB.levels={};
  if (!DB.lvlAge) DB.lvlAge={};
  if (!DB.credit) DB.credit={};
  if (DB.sinceChange==null) DB.sinceChange=0;
  if (DB.backupAt==null) DB.backupAt=0;
  if (!Array.isArray(DB.notes)) DB.notes=[];
  if (DB.fpu===undefined) DB.fpu=null;
  if (DB.active && !DB.active.exercises) DB.active.exercises=[];
  if (DB.active && !(DB.active.exercises||[]).length) DB.active.exercises=buildSession();
  if (DB.active && DB.active.idx==null) DB.active.idx=0;
  booted=true;
  render();
})();
/* iOS appku uspí bez varování, proto ukládáme při každém odchodu na pozadí. */
document.addEventListener("visibilitychange", function(){ if (booted && document.hidden) saveNow(); });
window.addEventListener("pagehide", function(){ if (booted) saveNow(); });
window.addEventListener("beforeunload", function(){ if (booted) saveNow(); });
})();
</script>
